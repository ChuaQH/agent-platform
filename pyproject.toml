[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aca-ecosystem"
version = "0.1.0"
description = "ACA Ecosystem — Autonomous Coding Agent + General Assistant, sharing core infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "qihan" }]

dependencies = [
    "openai>=1.0.0",           # DeepSeek API (OpenAI-compatible)
    "httpx>=0.27.0",           # Async HTTP client
    "typer>=0.12.0",           # CLI framework
    "rich>=13.0.0",            # Terminal formatting
    "pyyaml>=6.0",             # Config file parsing
    "lancedb>=0.12.0",         # Vector DB (Layer 4)
    "sentence-transformers>=3.0.0",  # bge-m3 embeddings
    "aiosqlite>=0.20.0",       # Async SQLite
    "watchfiles>=0.22.0",      # File watcher for cache invalidation
    "tzdata>=2025.1",          # IANA timezone data (required by zoneinfo on Windows)
    "sqlalchemy>=2.0.0",       # Database ORM (needed by Chainlit data layer)
    "aiosqlite>=0.20.0",       # Async SQLite
    "chainlit>=2.0.0",         # Chat UI for assistant agent (legacy)
    "fastapi>=0.115.0",        # Web API framework
    "uvicorn[standard]>=0.32.0", # ASGI server
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]
docs = [
    "pymupdf>=1.24.0",     # PDF extraction
    "openpyxl>=3.1.0",     # Spreadsheet reading
]

[project.scripts]
aca = "aca.cli.main:app"
assistant = "assistant.cli:main"
assistant-server = "assistant.server:app"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/aca", "src/assistant"]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
