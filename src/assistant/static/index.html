<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-hover: #21252f;
            --border: #2a2e3a;
            --text-primary: #e9eaec;
            --text-secondary: #9599a3;
            --text-tertiary: #6a6e78;
            --accent: #4f6ef6;
            --accent-hover: #6380f8;
            --accent-subtle: rgba(79,110,246,0.12);
            --user-bubble: #252a37;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --font: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        #app {
            width: 100%;
            max-width: 780px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ─────────────────────────── */
        #header {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg);
            flex-shrink: 0;
            -webkit-app-region: drag;
        }
        #header .avatar-sm {
            width: 28px; height: 28px;
            border-radius: var(--radius-sm);
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        #header h1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        #header .status {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-left: 6px;
        }
        #header .actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }
        #header .actions button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            transition: all 0.15s;
        }
        #header .actions button:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
        }

        /* ── Messages ───────────────────────── */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 24px 8px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }
        #messages::-webkit-scrollbar { width: 5px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb {
            background: transparent;
            border-radius: 10px;
        }
        #messages:hover::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        .msg-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: msgIn 0.25s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-row.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 32px; height: 32px;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            margin-top: 2px;
        }
        .msg-row.assistant .msg-avatar {
            background: var(--accent-subtle);
            color: var(--accent);
        }
        .msg-row.user .msg-avatar {
            background: var(--surface-hover);
            color: var(--text-secondary);
        }

        .msg-bubble {
            max-width: 78%;
            line-height: 1.62;
            font-size: 14px;
            position: relative;
        }
        .msg-row.assistant .msg-bubble {
            color: var(--text-primary);
        }
        .msg-row.user .msg-bubble {
            background: var(--user-bubble);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        /* Markdown inside assistant messages */
        .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
            margin: 18px 0 8px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .msg-bubble h1:first-child, .msg-bubble h2:first-child, .msg-bubble h3:first-child {
            margin-top: 0;
        }
        .msg-bubble h1 { font-size: 1.2em; }
        .msg-bubble h2 { font-size: 1.08em; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .msg-bubble h3 { font-size: 1em; }
        .msg-bubble p { margin: 8px 0; }
        .msg-bubble p:first-child { margin-top: 0; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble ul, .msg-bubble ol { margin: 10px 0; padding-left: 22px; }
        .msg-bubble li { margin: 4px 0; }
        .msg-bubble li::marker { color: var(--text-tertiary); }
        .msg-bubble code {
            background: var(--surface-hover);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #e2a47e;
        }
        .msg-bubble pre {
            background: #0d0f15;
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            overflow-x: auto;
            margin: 12px 0;
        }
        .msg-bubble pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
            font-size: 0.85em;
            line-height: 1.55;
        }
        .msg-bubble blockquote {
            border-left: 2px solid var(--accent);
            margin: 10px 0;
            padding: 2px 0 2px 14px;
            color: var(--text-secondary);
        }
        .msg-bubble strong { color: #f0f1f3; font-weight: 600; }
        .msg-bubble em { color: var(--text-secondary); }
        .msg-bubble hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 16px 0;
        }
        .msg-bubble a {
            color: var(--accent-hover);
            text-decoration: none;
        }
        .msg-bubble a:hover { text-decoration: underline; }
        .msg-bubble table {
            border-collapse: collapse;
            margin: 10px 0;
            width: 100%;
            font-size: 0.9em;
        }
        .msg-bubble th, .msg-bubble td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }
        .msg-bubble th {
            background: var(--surface-hover);
            font-weight: 600;
        }

        /* ── Collapsible thinking ──────────── */
        .thinking-block {
            margin-bottom: 16px;
            animation: msgIn 0.25s ease;
        }
        .thinking-summary {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-tertiary);
            cursor: pointer;
            padding: 4px 0;
            user-select: none;
        }
        .thinking-summary:hover { color: var(--text-secondary); }
        .thinking-summary .chevron {
            font-size: 10px;
            transition: transform 0.2s;
        }
        .thinking-block.expanded .chevron {
            transform: rotate(90deg);
        }
        .thinking-summary .spinner {
            width: 12px; height: 12px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .thinking-detail {
            display: none;
            margin-top: 8px;
            margin-left: 6px;
            padding-left: 16px;
            border-left: 2px solid var(--border);
        }
        .thinking-block.expanded .thinking-detail {
            display: block;
        }
        .thinking-step {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .thinking-step .step-text {
            display: flex;
            gap: 8px;
        }
        .thinking-step .step-bullet {
            color: var(--text-tertiary);
            flex-shrink: 0;
        }
        .thinking-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
            margin-left: 18px;
        }
        .link-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.15s;
        }
        .link-chip:hover {
            border-color: var(--accent);
            color: var(--accent-hover);
            background: var(--surface-hover);
        }
        .link-chip .favicon {
            width: 14px; height: 14px;
            border-radius: 2px;
        }
        .link-more {
            font-size: 12px;
            color: var(--accent);
            padding: 4px 6px;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .link-more:hover { color: var(--accent-hover); }

        /* ── Response loading placeholder ────── */
        .response-loading {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: msgIn 0.25s ease;
        }
        .response-loading .msg-avatar {
            background: var(--accent-subtle);
            color: var(--accent);
        }
        .response-loading .loading-dots {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 4px 0;
        }
        .response-loading .loading-dots span {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--text-tertiary);
            animation: dotBounce 1.2s infinite ease-in-out;
        }
        .response-loading .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
        .response-loading .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); background: var(--accent); }
        }

        /* ── Error ───────────────────────────── */
        .error-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: msgIn 0.25s ease;
        }
        .error-row .msg-avatar {
            background: rgba(239,68,68,0.12); color: #f87171;
        }
        .error-text {
            font-size: 14px;
            color: #fca5a5;
            line-height: 1.5;
        }

        /* ── Empty State ─────────────────────── */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }
        .empty-state .logo {
            width: 48px; height: 48px;
            border-radius: 14px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .empty-state h2 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }
        .empty-state p {
            color: var(--text-secondary);
            font-size: 14px;
            max-width: 340px;
            line-height: 1.5;
        }

        /* ── Input ──────────────────────────── */
        #input-area {
            padding: 12px 24px 20px;
            flex-shrink: 0;
            background: var(--bg);
        }
        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 6px 6px 6px 16px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(79,110,246,0.12);
        }
        #input-area textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 8px 0;
            font-family: var(--font);
            font-size: 14px;
            resize: none;
            min-height: 22px;
            max-height: 140px;
            line-height: 1.5;
            outline: none;
        }
        #input-area textarea::placeholder {
            color: var(--text-tertiary);
        }
        #send-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            width: 36px; height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        #send-btn:hover { background: var(--accent-hover); }
        #send-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        #send-btn svg {
            width: 16px; height: 16px;
        }
        .input-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">
            <div class="avatar-sm">✦</div>
            <h1>Assistant</h1>
            <span class="status" id="session-label"></span>
            <div class="actions">
                <button onclick="newSession()">New chat</button>
            </div>
        </div>

        <div id="messages">
            <div class="empty-state" id="empty-state">
                <div class="logo">✦</div>
                <h2>How can I help?</h2>
                <p>Ask me anything — I can search the web, do calculations, and remember things about you.</p>
            </div>
        </div>

        <div id="input-area">
            <div class="input-wrapper">
                <textarea
                    id="user-input"
                    placeholder="Type a message…"
                    rows="1"
                    autofocus
                ></textarea>
                <button id="send-btn" onclick="sendMessage()" aria-label="Send message">
                    <svg viewBox="0 0 16 16" fill="none">
                        <path d="M1 8L15 1L8 15L7 8L1 8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
        </div>
    </div>

    <script>
        const API = '/chat/stream';
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const emptyState = document.getElementById('empty-state');
        const sessionLabel = document.getElementById('session-label');

        let isLoading = false;

        // ── Auto-resize, keyboard ──────────────
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
        });
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            if (e.key === 'Escape') inputEl.blur();
        });

        // ── Send via SSE ───────────────────────
        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isLoading) return;

            isLoading = true;
            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;
            if (emptyState) emptyState.remove();

            // User bubble
            addUserMessage(text);

            // SSE stream
            let thinkBlock = null;
            let thinkStart = Date.now();
            let allSources = [];
            let responseLoading = null;
            let responseEl = null;
            let responseBubble = null;
            let responseText = '';

            // Show loading placeholder immediately
            responseLoading = addResponseLoading();

            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || `Server error (${res.status})`);
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        let event;
                        try { event = JSON.parse(line.slice(6)); }
                        catch { continue; }

                        switch (event.type) {
                            case 'thinking':
                                if (!thinkBlock) {
                                    thinkBlock = addThinkingBlock();
                                }
                                addThinkingStep(thinkBlock, event.content);
                                break;

                            case 'tool_result':
                                if (event.sources && event.sources.length > 0) {
                                    for (const s of event.sources) {
                                        if (!allSources.find(x => x.url === s.url)) {
                                            allSources.push(s);
                                        }
                                    }
                                    updateLinkChips(thinkBlock, allSources);
                                }
                                break;

                            case 'response':
                                if (responseLoading) {
                                    responseLoading.remove();
                                    responseLoading = null;
                                }
                                if (!responseEl) {
                                    const row = document.createElement('div');
                                    row.className = 'msg-row assistant';
                                    row.innerHTML = `
                                        <div class="msg-avatar">✦</div>
                                        <div class="msg-bubble"></div>`;
                                    messagesEl.appendChild(row);
                                    responseEl = row;
                                    responseBubble = row.querySelector('.msg-bubble');
                                }
                                responseText += event.content;
                                marked.setOptions({ breaks: true, gfm: true });
                                responseBubble.innerHTML = marked.parse(responseText);
                                break;

                            case 'done':
                                if (thinkBlock) {
                                    const elapsed = ((Date.now() - thinkStart) / 1000).toFixed(1);
                                    finalizeThinking(thinkBlock, elapsed);
                                }
                                if (responseLoading) {
                                    responseLoading.remove();
                                    responseLoading = null;
                                }
                                break;

                            case 'error':
                                if (responseLoading) {
                                    responseLoading.remove();
                                    responseLoading = null;
                                }
                                addErrorMessage(event.message);
                                break;
                        }
                        scrollDown();
                    }
                }
            } catch (err) {
                addErrorMessage(err.message);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                inputEl.focus();
                scrollDown();
            }
        }

        // ── UI builders ─────────────────────────
        function addResponseLoading() {
            const row = document.createElement('div');
            row.className = 'response-loading';
            row.innerHTML = `
                <div class="msg-avatar">✦</div>
                <div class="loading-dots"><span></span><span></span><span></span></div>`;
            messagesEl.appendChild(row);
            scrollDown();
            return row;
        }

        function addThinkingBlock() {
            const block = document.createElement('div');
            block.className = 'thinking-block';
            block.innerHTML = `
                <div class="thinking-summary" onclick="toggleThinking(this.parentElement)">
                    <span class="chevron">▸</span>
                    <span class="spinner"></span>
                    <span class="summary-text">Thinking…</span>
                </div>
                <div class="thinking-detail"></div>`;
            messagesEl.appendChild(block);
            scrollDown();
            return block;
        }

        function addThinkingStep(block, text) {
            if (!text || !text.trim()) return;
            const detail = block.querySelector('.thinking-detail');
            const step = document.createElement('div');
            step.className = 'thinking-step';
            step.innerHTML = `
                <div class="step-text">
                    <span class="step-bullet">•</span>
                    <span>${escapeHtml(text)}</span>
                </div>
                <div class="thinking-links"></div>`;
            detail.appendChild(step);
        }

        function updateLinkChips(block, sources) {
            if (!block || sources.length === 0) return;
            const steps = block.querySelectorAll('.thinking-step');
            if (steps.length === 0) return;
            const lastStep = steps[steps.length - 1];
            let linksDiv = lastStep.querySelector('.thinking-links');
            linksDiv.innerHTML = '';

            const maxShow = 4;
            const visible = sources.slice(0, maxShow);
            const hidden = sources.slice(maxShow);

            const renderLink = (s) => {
                const domain = extractDomain(s.url);
                const a = document.createElement('a');
                a.className = 'link-chip';
                a.href = s.url;
                a.target = '_blank';
                a.rel = 'noopener';
                a.innerHTML = `<img class="favicon" src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" alt="" onerror="this.style.display='none'">${escapeHtml(domain)}`;
                a.title = s.title;
                return a;
            };

            visible.forEach(s => linksDiv.appendChild(renderLink(s)));

            if (hidden.length > 0) {
                let expanded = false;
                const hiddenChips = hidden.map(renderLink);
                const more = document.createElement('span');
                more.className = 'link-more';
                more.textContent = `+${hidden.length} more`;
                more.onclick = function(e) {
                    e.stopPropagation();
                    if (!expanded) {
                        hiddenChips.forEach(c => linksDiv.insertBefore(c, more));
                        more.textContent = 'Show less';
                        expanded = true;
                    } else {
                        hiddenChips.forEach(c => c.remove());
                        more.textContent = `+${hidden.length} more`;
                        expanded = false;
                    }
                };
                linksDiv.appendChild(more);
            }
        }

        function finalizeThinking(block, elapsedSec) {
            const summary = block.querySelector('.thinking-summary');
            const spinner = summary.querySelector('.spinner');
            const text = summary.querySelector('.summary-text');
            if (spinner) spinner.remove();
            text.textContent = `Thought for ${elapsedSec}s`;
        }

        function toggleThinking(block) {
            block.classList.toggle('expanded');
        }

        function addUserMessage(text) {
            const row = document.createElement('div');
            row.className = 'msg-row user';
            row.innerHTML = `
                <div class="msg-avatar">U</div>
                <div class="msg-bubble">${escapeHtml(text)}</div>`;
            messagesEl.appendChild(row);
            scrollDown();
        }

        function extractDomain(url) {
            try { return new URL(url).hostname.replace('www.', ''); }
            catch { return url; }
        }

        function addErrorMessage(text) {
            const row = document.createElement('div');
            row.className = 'error-row';
            row.innerHTML = `
                <div class="msg-avatar" style="width:32px;height:32px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;background:rgba(239,68,68,0.12);color:#f87171">!</div>
                <div class="error-text">${escapeHtml(text)}</div>`;
            messagesEl.appendChild(row);
            scrollDown();
        }

        function scrollDown() {
            setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 10);
        }

        function newSession() {
            messagesEl.innerHTML = '';
            const div = document.createElement('div');
            div.className = 'empty-state'; div.id = 'empty-state';
            div.innerHTML = '<div class="logo">✦</div><h2>How can I help?</h2><p>Ask me anything.</p>';
            messagesEl.appendChild(div);
            sessionLabel.textContent = '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
