name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  DEEPSEEK_API_KEY: ""
  BRAVE_API_KEY: ""
  OAUTH_GOOGLE_CLIENT_ID: ""
  OAUTH_GOOGLE_CLIENT_SECRET: ""

jobs:
  backend:
    name: Backend unit and boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check import boundaries
        run: python scripts/check_imports.py
      - name: Check installed requirements
        run: python -m pip check
      - name: Run non-integration tests
        run: python -m pytest -m "not integration"

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agent_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agent_platform_test
      ACA_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agent_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Migrate isolated test database to head
        run: python -m alembic upgrade head
      - name: Check migration/model consistency
        run: python -m alembic check
      - name: Run destructive-operation safety guard
        run: python -m pytest tests/test_integration_database_safety.py
      - name: Run PostgreSQL integration tests
        run: python -m pytest -m integration

  evaluator:
    name: Scripted governed-agent evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVALUATION_OUTPUT: ${{ runner.temp }}/evaluation-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Scripted control regression
        run: python -m evaluations.agent_controls run --mode scripted --configuration all --output "$EVALUATION_OUTPUT" --label control-regression
      - name: Scripted React strategy regression
        run: python -m evaluations.agent_controls run --mode scripted --strategy react --configuration enforced_policy_with_approval --scenario-category strategy --output "$EVALUATION_OUTPUT" --label react-strategy
      - name: Scripted plan-react strategy regression
        run: python -m evaluations.agent_controls run --mode scripted --strategy plan_react --configuration enforced_policy_with_approval --scenario-category strategy --output "$EVALUATION_OUTPUT" --label plan-react-strategy
      - name: Scripted v1.3 React recovery conformance
        run: python -m evaluations.agent_controls run --mode scripted --strategy react --configuration enforced_policy_with_approval --scenario-category recovery --output "$EVALUATION_OUTPUT" --label react-recovery-v13
      - name: Scripted v1.3 plan-react recovery conformance
        run: python -m evaluations.agent_controls run --mode scripted --strategy plan_react --configuration enforced_policy_with_approval --scenario-category recovery --output "$EVALUATION_OUTPUT" --label plan-react-recovery-v13
      - name: Upload scripted evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripted-evaluation-reports
          path: ${{ runner.temp }}/evaluation-results
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend type, unit, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/assistant-web/package-lock.json
      - name: Install lockfile-pinned dependencies
        working-directory: apps/assistant-web
        run: npm ci
      - name: Type-check
        working-directory: apps/assistant-web
        run: npx tsc --noEmit
      - name: Run unit tests
        working-directory: apps/assistant-web
        run: npm test
      - name: Production build
        working-directory: apps/assistant-web
        run: npm run build
