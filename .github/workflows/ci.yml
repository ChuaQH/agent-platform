name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agent_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agent_platform_test
      ACA_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agent_platform_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Architecture import boundaries
        run: python scripts/check_imports.py

      - name: Syntax / import smoke checks
        run: python -m compileall -q src tests migrations scripts

      - name: Migrate database to head
        run: alembic upgrade head

      - name: Alembic check (no model/migration drift)
        run: alembic check

      - name: Verify clean database lifecycle
        run: python scripts/verify_migrations.py

      - name: Fast unit tests (no database)
        run: python -m pytest -m "not integration"

      - name: PostgreSQL integration tests
        run: python -m pytest -m integration

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (lockfile-pinned)
        working-directory: apps/assistant-web
        run: npm ci

      - name: Type-check
        working-directory: apps/assistant-web
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/assistant-web
        run: npm run build
